    get:
      tags: [Student Dashboard]
      summary: Get booking slots
      responses:
        '200':
          description: Regular and one-to-one slots
  /student/book-session:
    post:
      tags: [Student Dashboard]
      summary: Book a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Booking success
        '400':
          description: Bad Request (invalid or missing session_id)
  /student/upcoming-sessions:
    get:
      tags: [Student Dashboard]
      summary: Get upcoming sessions
      responses:
        '200':
          description: Upcoming sessions list
