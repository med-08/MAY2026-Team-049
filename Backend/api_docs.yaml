    get:
      tags: [Student Dashboard]
      summary: Get study tips
      responses:
        '200':
          description: Study tips list
  /student/assignments:
    get:
      tags: [Student Dashboard]
      summary: Get assignments list
      responses:
        '200':
          description: Assignments list
  /student/assignments/{id}/update-progress:
    post:
      tags: [Student Dashboard]
      summary: Update assignment progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Valid progress payload
      responses:
        '200':
          description: Progress updated
  /student/assignments/{id}/complete:
    post:
      tags: [Student Dashboard]
      summary: Mark homework as completed - sets homeworkStatus to "Done"
      description: >
        Homework has exactly four possible `homeworkStatus` values: Pending,
        Due Today, Due Passed, Done. No 100%-progress requirement - this
        endpoint is the only way a student moves an assignment to Done.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Homework marked as completed (homeworkStatus is now "Done")
        '403':
          description: Assignment is not available to this student
        '404':
          description: Assignment not found
  /student/tutors:
    get:
      tags: [Student Dashboard]
      summary: Get tutors relevant to the student (used by Ask Doubt)
      responses:
        '200':
          description: List of tutors and enrolled subjects
  /student/doubts:
    get:
      tags: [Student Dashboard]
      summary: Get the student's own submitted doubts, including tutor replies
      responses:
        '200':
          description: List of doubts with status and answer
    post:
      tags: [Student Dashboard]
      summary: Submit a new doubt to a tutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                subject:
                  type: string
                tutor_id:
                  type: integer
      responses:
        '201':
          description: Doubt submitted, tutor notified
        '400':
          description: Bad Request (missing question)
        '404':
          description: Selected tutor not available / no tutor available

